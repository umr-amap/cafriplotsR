name: Build query-plots Docker image

# Builds the Query Plots app image and pushes it to the GitHub Container
# Registry (ghcr.io). No external account or secrets are needed: the built-in
# GITHUB_TOKEN authenticates the push.
#
# One manual step after the first successful run: in the repo's Packages tab,
# set the "cafri-queryplots" package visibility to Public so SSP Cloud can pull
# it anonymously (free, no pull rate limits).
on:
  push:
    branches: [master]
    paths:
      - "R/**"
      - "DESCRIPTION"
      - "NAMESPACE"
      # inst/** (not just inst/app/...) so packaged resources baked into the
      # image — e.g. inst/translations/translation.json — also trigger a rebuild.
      - "inst/**"
      - "deployment/query_plots/Dockerfile"
      - ".github/workflows/docker-query-plots.yml"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/cafri-queryplots

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/query_plots/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
