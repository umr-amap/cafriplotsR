name: Build taxonomic-match Docker image

# Builds the Taxonomic Name Standardization app image and pushes it to the
# GitHub Container Registry (ghcr.io). No external account or secrets are
# needed: the built-in GITHUB_TOKEN authenticates the push.
#
# One manual step after the first successful run: in the repo's Packages tab,
# set the "cafri-taxomatch" package visibility to Public so SSP Cloud can pull
# it anonymously (free, no pull rate limits).
on:
  push:
    branches: [master]
    paths:
      - "R/**"
      - "DESCRIPTION"
      - "NAMESPACE"
      - "inst/app/taxonomic_match/**"
      - "deployment/taxonomic_match/Dockerfile"
      - ".github/workflows/docker-taxonomic-match.yml"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/cafri-taxomatch

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/taxonomic_match/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
