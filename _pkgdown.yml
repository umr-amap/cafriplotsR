url: https://umr-amap.github.io/cafriplotsR/
template:
  bootstrap: 5
  bslib:
    primary: "#2C5F2D"
    secondary: "#97BC62"
    success: "#97BC62"
    link-color: "#2C5F2D"
    navbar-bg: "#2C5F2D"
    navbar-light-brand-color: "#ffffff"
