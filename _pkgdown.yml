    navbar-light-hover-color: "#97BC62"

news:
  cran_dates: false

navbar:
  right:
    - text: "FR"
      href: articles/readme-fr.html
    - icon: fa-github
      href: https://github.com/umr-amap/cafriplotsR
      aria-label: GitHub
    - icon: fa-bug
      href: https://github.com/umr-amap/cafriplotsR/issues
      aria-label: Report an issue

