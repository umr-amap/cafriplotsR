# Permanent probe fix.
#
# The upstream `shiny` sub-chart hardcodes a tight HTTP GET `/` liveness/
# readiness probe (timeoutSeconds ~1, failureThreshold 3, periodSeconds 10) and
# does NOT expose it via values. That probe is rendered by the single shared R
# worker, so while one session loads the taxonomic backbone the worker is
# blocked, the probe times out, and Kubernetes restarts the pod (crash loop
# under concurrency).
#
# We keep the SAME handler type (httpGet) and only loosen the timing so the
# probe tolerates a busy worker for several minutes. This is deliberate: a
# probe may have only one handler type, so switching httpGet -> tcpSocket would
# make `helm upgrade` produce an invalid two-handler probe (helm reasserts the
# chart's httpGet against a live tcpSocket). Patching only timing fields keeps
# the handler unchanged, so it strategic-merges cleanly on every upgrade.
#
# Because it runs as a post-install/post-upgrade hook, the loosened timing is
# re-applied on every install and upgrade.
#
# Requires the release namespace to allow creating ServiceAccount/Role/
# RoleBinding/Job (granted by the SSP Cloud "admin" Kubernetes role used to
# install the chart).

apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-probe-patcher
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-probe-patcher
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-probe-patcher
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-probe-patcher
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-probe-patcher
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-probe-patch
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 120
  template:
    spec:
      serviceAccountName: {{ .Release.Name }}-probe-patcher
      restartPolicy: Never
      containers:
        - name: kubectl
          # Any image containing kubectl. Override via probePatch.image if this
          # one is unavailable on your cluster's registry.
          image: {{ .Values.probePatch.image | default "bitnami/kubectl:latest" }}
          command:
            - /bin/sh
            - -c
            - |
              kubectl patch deployment {{ .Release.Name }}-shiny --type=json -p='[
                {"op":"add","path":"/spec/template/spec/containers/0/livenessProbe/timeoutSeconds","value":10},
                {"op":"add","path":"/spec/template/spec/containers/0/livenessProbe/periodSeconds","value":30},
                {"op":"add","path":"/spec/template/spec/containers/0/livenessProbe/failureThreshold","value":10},
                {"op":"add","path":"/spec/template/spec/containers/0/readinessProbe/timeoutSeconds","value":10},
                {"op":"add","path":"/spec/template/spec/containers/0/readinessProbe/periodSeconds","value":30},
                {"op":"add","path":"/spec/template/spec/containers/0/readinessProbe/failureThreshold","value":10}
              ]'
